<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro do Eleitor</title>


    <!-- ============================================================
         MEDIAPIPE HANDS
    ============================================================ -->

    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
    ></script>


    <!-- ============================================================
         CSS DO CADASTRO
    ============================================================ -->

    <link
        rel="stylesheet"
        href="cadastro.css"
    >

</head>


<body>


    <!-- ============================================================
         MENU FIXO DO CADASTRO
    ============================================================ -->

    <header class="menu-cadastro">


        <!-- ========================================================
             LOGO
        ========================================================= -->

        <div class="logo-cadastro">

            <img
                src="imagens/TSF.png"
                alt="Logo gov.br"
            >

            <div class="texto-logo">

                <strong>CADASTRO</strong>

                <small>DO ELEITOR</small>

            </div>

        </div>


        <!-- ========================================================
             CONTROLES DE ACESSIBILIDADE + CÂMERA
        ========================================================= -->

        <div class="controles-cadastro">


            <!-- ====================================================
                 AUMENTAR FONTE
            ===================================================== -->

            <button
                type="button"
                onclick="aumentarFonte()"
                aria-label="Aumentar tamanho da fonte"
                title="Aumentar fonte"
            >
                A+
            </button>


            <!-- ====================================================
                 DIMINUIR FONTE
            ===================================================== -->

            <button
                type="button"
                onclick="diminuirFonte()"
                aria-label="Diminuir tamanho da fonte"
                title="Diminuir fonte"
            >
                A−
            </button>


            <!-- ====================================================
                 RESTAURAR ACESSIBILIDADE
            ===================================================== -->

            <button
                type="button"
                onclick="normalizarAcessibilidade()"
                aria-label="Restaurar acessibilidade"
                title="Restaurar"
            >
                ↻
            </button>


            <!-- ====================================================
                 ALTO CONTRASTE
            ===================================================== -->

            <button
                type="button"
                onclick="alternarContraste()"
                aria-label="Ativar ou desativar alto contraste"
                title="Alto contraste"
            >
                ◐
            </button>


            <!-- ====================================================
                 CADASTRAR PELA CÂMERA
            ===================================================== -->

            <button
                type="button"
                id="botaoCamera"
                onclick="abrirCameraCadastro()"
            >
                📷&nbsp;&nbsp;Cadastrar pela câmera
            </button>


        </div>

    </header>


    <!-- ============================================================
         FORMULÁRIO
    ============================================================ -->

    <div class="container">


        <!-- ========================================================
             TÍTULO
        ========================================================= -->

        <h1>
            Cadastro do Eleitor
        </h1>


        <!-- ========================================================
             SUBTÍTULO
        ========================================================= -->

        <p class="subtitulo">
            Preencha os dados abaixo para continuar
        </p>


        <!-- ========================================================
             FORMULÁRIO
        ========================================================= -->

        <form
            id="formCadastro"
            method="POST"
            target="iframeEnvio"
        >


            <!-- ====================================================
                 NOME
            ===================================================== -->

            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- ====================================================
                 CPF
            ===================================================== -->

            <div class="campo">

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="Digite o CPF"
                    inputmode="numeric"
                    maxlength="11"
                    required
                >

                <span class="limite">
                    11 números
                </span>

            </div>


            <!-- ====================================================
                 TÍTULO DE ELEITOR
            ===================================================== -->

            <div class="campo">

                <label for="titulo">
                    Título de eleitor
                </label>

                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    placeholder="Digite o título de eleitor"
                    inputmode="numeric"
                    maxlength="12"
                    required
                >

                <span class="limite">
                    12 números
                </span>

            </div>


            <!-- ====================================================
                 BOTÃO CONFIRMAR
            ===================================================== -->

            <button
                type="submit"
                id="botaoConfirmar"
            >
                CONFIRMAR
            </button>


        </form>


        <!-- ========================================================
             MENSAGEM
        ========================================================= -->

        <div id="mensagem"></div>


    </div>


    <!-- ============================================================
         IFRAME DO ENVIO PARA O GOOGLE APPS SCRIPT
    ============================================================ -->

    <iframe
        name="iframeEnvio"
        id="iframeEnvio"
    ></iframe>


    <!-- ============================================================
         VLibras
    ============================================================ -->

    <div
        vw
        class="enabled"
    >

        <div
            vw-access-button
            class="active"
        ></div>


        <div
            vw-plugin-wrapper
        >

            <div
                class="vw-plugin-top-wrapper"
            ></div>

        </div>

    </div>


    <!-- ============================================================
         ÁREA DA CÂMERA
    ============================================================ -->

    <div id="cameraArea">


        <!-- ========================================================
             VÍDEO
        ========================================================= -->

        <video
            id="videoCamera"
            autoplay
            playsinline
        ></video>


        <!-- ========================================================
             STATUS
        ========================================================= -->

        <div id="statusCamera">

            Aponte o dedo para um elemento e junte o polegar
            com o indicador para clicar.

        </div>


        <!-- ========================================================
             FECHAR CÂMERA
        ========================================================= -->

        <button
            type="button"
            id="fecharCamera"
            onclick="fecharCameraCadastro()"
        >
            FECHAR CÂMERA
        </button>


    </div>


    <!-- ============================================================
         PONTEIRO VIRTUAL DO DEDO
    ============================================================ -->

    <div id="ponteiroDedo"></div>


    <!-- ============================================================
         SCRIPT VLibras
    ============================================================ -->

    <script
        src="https://vlibras.gov.br/app/vlibras-plugin.js"
    ></script>


    <!-- ============================================================
         JAVASCRIPT DO CADASTRO
    ============================================================ -->

    <script src="cadastro.js"></script>


</body>

</html>
