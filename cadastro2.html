<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro do Eleitor</title>


    <style>

        /* ============================================================
           CONFIGURAÇÕES GERAIS
        ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #8a919a,
                    #5e666d,
                    #969ea4
                );

        }


        /* ============================================================
           CONTAINER
        ============================================================ */

        .container {

            width: 100%;

            max-width: 500px;

            padding: 40px;

            background: #ffffff;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.20);

        }


        /* ============================================================
           TÍTULO
        ============================================================ */

        h1 {

            text-align: center;

            color: #00050c;

            margin-bottom: 10px;

        }


        /* ============================================================
           SUBTÍTULO
        ============================================================ */

        .subtitulo {

            text-align: center;

            color: #666666;

            margin-bottom: 30px;

        }


        /* ============================================================
           CAMPOS
        ============================================================ */

        .campo {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333333;

        }


        input {

            width: 100%;

            height: 50px;

            padding: 0 15px;

            border: 2px solid #dddddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

        }


        input:focus {

            border-color: #4e555c;

            box-shadow:
                0 0 0 3px
                rgba(25, 118, 210, 0.15);

        }


        /* ============================================================
           LIMITE DOS CAMPOS
        ============================================================ */

        .limite {

            display: block;

            margin-top: 5px;

            text-align: right;

            font-size: 12px;

            color: #777777;

        }


        /* ============================================================
           BOTÃO CONFIRMAR
        ============================================================ */

        #botaoConfirmar {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #0b3d91,
                    #1976d2
                );

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        #botaoConfirmar:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* ============================================================
           MENSAGEM
        ============================================================ */

        #mensagem {

            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            text-align: center;

            font-weight: bold;

        }


        #mensagem.sucesso {

            display: block;

            background: #e8f5e9;

            color: #2e7d32;

        }


        #mensagem.erro {

            display: block;

            background: #ffebee;

            color: #c62828;

        }


        /* ============================================================
           IFRAME
        ============================================================ */

        #iframeEnvio {

            display: none;

        }


        /* ============================================================
           PAINEL DE ACESSIBILIDADE
        ============================================================ */

        .acessibilidade {

            position: fixed;

            top: 20px;

            right: 20px;

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 8px;

            background: #ffffff;

            border-radius: 12px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.18);

            z-index: 9999;

        }


        /* ============================================================
           BOTÕES DE ACESSIBILIDADE
        ============================================================ */

        .acessibilidade button {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 8px;

            background: #0b3d91;

            color: #ffffff;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition:
                0.2s ease;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .acessibilidade button:hover {

            background: #1976d2;

            transform: translateY(-2px);

        }


        .acessibilidade button:focus {

            outline: 3px solid #42a5f5;

            outline-offset: 2px;

        }


        /* ============================================================
           ALTO CONTRASTE
        ============================================================ */

        body.alto-contraste {

            background: #000000 !important;

            color: #ffffff !important;

        }


        body.alto-contraste .container {

            background: #000000 !important;

            color: #ffffff !important;

            border: 3px solid #ffffff;

        }


        body.alto-contraste h1 {

            color: #ffffff !important;

        }


        body.alto-contraste .subtitulo {

            color: #ffffff !important;

        }


        body.alto-contraste label {

            color: #ffffff !important;

        }


        body.alto-contraste input {

            background: #000000 !important;

            color: #ffffff !important;

            border: 2px solid #ffffff !important;

        }


        body.alto-contraste input::placeholder {

            color: #ffffff !important;

        }


        body.alto-contraste .limite {

            color: #ffffff !important;

        }


        body.alto-contraste .acessibilidade {

            background: #000000 !important;

            border: 2px solid #ffffff;

        }


        body.alto-contraste .acessibilidade button {

            background: #ffffff !important;

            color: #000000 !important;

            border: 2px solid #ffffff;

        }


        body.alto-contraste #botaoConfirmar {

            background: #ffffff !important;

            color: #000000 !important;

        }


        body.alto-contraste #mensagem.sucesso {

            background: #000000 !important;

            color: #00ff00 !important;

            border: 2px solid #00ff00;

        }


        body.alto-contraste #mensagem.erro {

            background: #000000 !important;

            color: #ff4444 !important;

            border: 2px solid #ff4444;

        }


        /* ============================================================
           RESPONSIVO
        ============================================================ */

        @media (max-width: 600px) {

            .container {

                padding: 25px;

            }


            h1 {

                font-size: 24px;

            }


            .acessibilidade {

                top: 10px;

                right: 10px;

                gap: 5px;

                padding: 6px;

            }


            .acessibilidade button {

                width: 38px;

                height: 38px;

                font-size: 15px;

            }

        }
        /* ============================================================
   ACESSIBILIDADE POR CÂMERA
============================================================ */

.camera-acessibilidade {

position: fixed;

bottom: 20px;

left: 20px;

z-index: 10000;

padding: 12px 18px;

border: none;

border-radius: 12px;

background:
    linear-gradient(
        135deg,
        #312c8f,
        #0b815b
    );

color: #ffffff;

font-size: 15px;

font-weight: bold;

cursor: pointer;

box-shadow:
    0 8px 25px
    rgba(0, 0, 0, 0.25);

transition: 0.2s ease;

}


.camera-acessibilidade:hover {

transform: translateY(-2px);

filter: brightness(1.1);

}


/* ============================================================
ÁREA DA CÂMERA
============================================================ */

#cameraAcessibilidade {

display: none;

position: fixed;

bottom: 20px;

left: 20px;

width: 260px;

padding: 10px;

background: #ffffff;

border-radius: 15px;

box-shadow:
    0 10px 35px
    rgba(0, 0, 0, 0.30);

z-index: 10001;

}


/* VÍDEO */

#videoCamera {

width: 100%;

border-radius: 10px;

transform: scaleX(-1);

}


/* TEXTO */

.camera-status {

margin-top: 8px;

text-align: center;

font-size: 13px;

font-weight: bold;

color: #333333;

}


/* BOTÃO DESLIGAR */

#desligarCamera {

width: 100%;

margin-top: 8px;

padding: 9px;

border: none;

border-radius: 8px;

background: #c62828;

color: #ffffff;

font-weight: bold;

cursor: pointer;

}


/* ============================================================
PONTEIRO DA CÂMERA
============================================================ */

#ponteiroCamera {

position: fixed;

width: 28px;

height: 28px;

border-radius: 50%;

border: 4px solid #ffffff;

background: #ff1744;

box-shadow:
    0 0 0 3px #312c8f,
    0 4px 15px
    rgba(0, 0, 0, 0.35);

pointer-events: none;

z-index: 99999;

display: none;

transform: translate(-50%, -50%);

}


/* ============================================================
INDICADOR DE CLIQUE
============================================================ */

#progressoClique {

position: fixed;

width: 42px;

height: 42px;

border-radius: 50%;

border: 4px solid #0b815b;

pointer-events: none;

z-index: 99998;

display: none;

transform:
    translate(-50%, -50%)
    scale(0.2);

transition:
    transform 0.1s linear;

}


/* ============================================================
TECLADO VIRTUAL
============================================================ */

#tecladoVirtual {

display: none;

position: fixed;

left: 50%;

bottom: 20px;

transform: translateX(-50%);

width: min(700px, 94vw);

padding: 15px;

background: #ffffff;

border-radius: 18px;

box-shadow:
    0 15px 50px
    rgba(0, 0, 0, 0.30);

z-index: 10002;

}


#tituloTeclado {

text-align: center;

margin-bottom: 12px;

color: #222222;

font-size: 16px;

font-weight: bold;

}


.teclas {

display: grid;

grid-template-columns:
    repeat(10, 1fr);

gap: 7px;

}


.tecla {

min-height: 48px;

border: none;

border-radius: 8px;

background:
    linear-gradient(
        135deg,
        #312c8f,
        #0b815b
    );

color: #ffffff;

font-size: 17px;

font-weight: bold;

cursor: pointer;

}


.tecla:hover {

filter: brightness(1.15);

}


.tecla-especial {

background: #444444;

}


.tecla-apagar {

background: #c62828;

}


.tecla-ok {

background: #2e7d32;

}


/* ============================================================
RESPONSIVO
============================================================ */

@media (max-width: 600px) {

.camera-acessibilidade {

    bottom: 10px;

    left: 10px;

    font-size: 13px;

}


#cameraAcessibilidade {

    width: 210px;

    bottom: 10px;

    left: 10px;

}


.teclas {

    grid-template-columns:
        repeat(5, 1fr);

}


.tecla {

    min-height: 44px;

    font-size: 15px;

}

}

    </style>

</head>


<body>
    <!-- ============================================================
     BOTÃO DE ACESSIBILIDADE POR CÂMERA
============================================================ -->

<button
type="button"
id="ativarCamera"
class="camera-acessibilidade"
aria-label="Ativar acessibilidade por câmera"
title="Usar acessibilidade por câmera"
>
📷 Usar acessibilidade por câmera
</button>


<!-- ============================================================
 PONTEIRO DA CÂMERA
============================================================ -->

<div id="ponteiroCamera"></div>

<div id="progressoClique"></div>


<!-- ============================================================
 CÂMERA
============================================================ -->

<div id="cameraAcessibilidade">

<video
    id="videoCamera"
    autoplay
    playsinline
    muted
></video>

<div
    class="camera-status"
    id="cameraStatus"
>
    Aponte o dedo indicador para a tela
</div>

<button
    type="button"
    id="desligarCamera"
>
    DESLIGAR CÂMERA
</button>

</div>


<!-- ============================================================
 TECLADO VIRTUAL
============================================================ -->

<div id="tecladoVirtual">

<div id="tituloTeclado">
    Teclado virtual
</div>

<div
    class="teclas"
    id="teclas"
></div>

</div>


    <!-- ============================================================
         PAINEL DE ACESSIBILIDADE
    ============================================================ -->

    <div
        class="acessibilidade"
        id="acessibilidade"
    >


        <!-- AUMENTAR FONTE -->

        <button
            type="button"
            onclick="aumentarFonte()"
            aria-label="Aumentar tamanho da fonte"
            title="Aumentar fonte"
        >

            A+

        </button>


        <!-- DIMINUIR FONTE -->

        <button
            type="button"
            onclick="diminuirFonte()"
            aria-label="Diminuir tamanho da fonte"
            title="Diminuir fonte"
        >

            A−

        </button>


        <!-- RESTAURAR -->

        <button
            type="button"
            onclick="normalizarAcessibilidade()"
            aria-label="Restaurar acessibilidade"
            title="Restaurar"
        >

            ↻

        </button>


        <!-- CONTRASTE -->

        <button
            type="button"
            onclick="alternarContraste()"
            aria-label="Ativar ou desativar alto contraste"
            title="Alto contraste"
        >

            ◐

        </button>


    </div>


    <!-- ============================================================
         FORMULÁRIO
    ============================================================ -->

    <div class="container">


        <h1>
            Cadastro do Eleitor
        </h1>


        <p class="subtitulo">
            Preencha os dados abaixo para continuar
        </p>


        <form
            id="formCadastro"
            method="POST"
            target="iframeEnvio"
        >


            <!-- NOME -->

            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- CPF -->

            <div class="campo">

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="Digite o CPF"
                    inputmode="numeric"
                    maxlength="11"
                    required
                >

                <span class="limite">
                    11 números
                </span>

            </div>


            <!-- TÍTULO -->

            <div class="campo">

                <label for="titulo">
                    Título de eleitor
                </label>

                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    placeholder="Digite o título de eleitor"
                    inputmode="numeric"
                    maxlength="12"
                    required
                >

                <span class="limite">
                    12 números
                </span>

            </div>


            <!-- CONFIRMAR -->

            <button
                type="submit"
                id="botaoConfirmar"
            >

                CONFIRMAR

            </button>


        </form>


        <!-- MENSAGEM -->

        <div id="mensagem"></div>


    </div>


    <!-- ============================================================
         IFRAME DO ENVIO
    ============================================================ -->

    <iframe
        name="iframeEnvio"
        id="iframeEnvio"
    ></iframe>


    <!-- ============================================================
         VLibras
    ============================================================ -->

    <div
        vw
        class="enabled"
    >

        <div
            vw-access-button
            class="active"
        ></div>


        <div
            vw-plugin-wrapper
        >

            <div
                class="vw-plugin-top-wrapper"
            ></div>

        </div>

    </div>


    <!-- ============================================================
         SCRIPT VLibras
    ============================================================ -->

    <script
        src="https://vlibras.gov.br/app/vlibras-plugin.js"
    ></script>


    <script>

        /* ============================================================
           INICIA VLibras
        ============================================================ */

        new window.VLibras.Widget(
            "https://vlibras.gov.br/app"
        );


        /* ============================================================
           URL DO GOOGLE APPS SCRIPT
        ============================================================ */

        const URL_SCRIPT =
            "https://script.google.com/macros/s/AKfycbxDDv5WOBl5n6fhQ0GYA4EQRaH2tiwhAGAtGhGbPqlPhbzQcgFYFoHLWId9GSHx0stS/exec";


        /* ============================================================
           ELEMENTOS
        ============================================================ */

        const formulario =
            document.getElementById(
                "formCadastro"
            );


        const nome =
            document.getElementById(
                "nome"
            );


        const cpf =
            document.getElementById(
                "cpf"
            );


        const titulo =
            document.getElementById(
                "titulo"
            );


        const botao =
            document.getElementById(
                "botaoConfirmar"
            );


        const mensagem =
            document.getElementById(
                "mensagem"
            );


        /* ============================================================
           DESTINO DO FORMULÁRIO
        ============================================================ */

        formulario.action =
            URL_SCRIPT;


        /* ============================================================
           NOME
        ============================================================ */

        nome.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(
                        /[^A-Za-zÀ-ÿ\s]/g,
                        ""
                    );

            }
        );


        /* ============================================================
           CPF
        ============================================================ */

        cpf.addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .slice(0, 11);

            }
        );


        /* ============================================================
           TÍTULO
        ============================================================ */

        titulo.addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .slice(0, 12);

            }
        );


        /* ============================================================
           ENVIO
        ============================================================ */

        formulario.addEventListener(
            "submit",
            function (evento) {

                const nomeValor =
                    nome.value.trim();


                /* VALIDA NOME */

                if (
                    !/^[A-Za-zÀ-ÿ\s]+$/.test(
                        nomeValor
                    )
                ) {

                    evento.preventDefault();

                    mostrarMensagem(
                        "Digite o nome usando apenas letras.",
                        "erro"
                    );

                    return;

                }


                /* VALIDA CPF */

                if (
                    !/^\d{11}$/.test(
                        cpf.value
                    )
                ) {

                    evento.preventDefault();

                    mostrarMensagem(
                        "O CPF deve possuir exatamente 11 números.",
                        "erro"
                    );

                    return;

                }


                /* VALIDA TÍTULO */

                if (
                    !/^\d{12}$/.test(
                        titulo.value
                    )
                ) {

                    evento.preventDefault();

                    mostrarMensagem(
                        "O título deve possuir exatamente 12 números.",
                        "erro"
                    );

                    return;

                }


                /* MOSTRA ENVIANDO */

                botao.disabled =
                    true;


                botao.textContent =
                    "ENVIANDO...";


                mostrarMensagem(
                    "Enviando cadastro...",
                    "sucesso"
                );

            }
        );


        /* ============================================================
           IFRAME
        ============================================================ */

        const iframe =
            document.getElementById(
                "iframeEnvio"
            );


        iframe.addEventListener(
            "load",
            function () {

                if (
                    botao.disabled === true
                ) {

                    setTimeout(
                        function () {

                            mostrarMensagem(
                                "Cadastro realizado com sucesso!",
                                "sucesso"
                            );


                            formulario.reset();


                            botao.disabled =
                                false;


                            botao.textContent =
                                "CONFIRMAR";

                        },
                        1000
                    );

                }

            }
        );


        /* ============================================================
           MENSAGEM
        ============================================================ */

        function mostrarMensagem(
            texto,
            tipo
        ) {

            mensagem.textContent =
                texto;


            mensagem.className =
                tipo;

        }


        /* ============================================================
           TAMANHO DA FONTE
        ============================================================ */

        let tamanhoFonte =
            100;


        function aumentarFonte() {

            if (
                tamanhoFonte < 150
            ) {

                tamanhoFonte += 10;


                document.documentElement.style.fontSize =
                    tamanhoFonte + "%";

            }

        }


        function diminuirFonte() {

            if (
                tamanhoFonte > 80
            ) {

                tamanhoFonte -= 10;


                document.documentElement.style.fontSize =
                    tamanhoFonte + "%";

            }

        }


        /* ============================================================
           CONTRASTE
        ============================================================ */

        function alternarContraste() {

            document.body.classList.toggle(
                "alto-contraste"
            );

        }


        /* ============================================================
           RESTAURAR ACESSIBILIDADE
        ============================================================ */

        function normalizarAcessibilidade() {

            /* Volta a fonte para 100% */

            tamanhoFonte =
                100;


            document.documentElement.style.fontSize =
                "100%";


            /* Desativa o alto contraste */

            document.body.classList.remove(
                "alto-contraste"
            );

        }
        

/* ============================================================
   ACESSIBILIDADE POR CÂMERA
============================================================ */


/* ELEMENTOS */

const ativarCamera =
    document.getElementById(
        "ativarCamera"
    );


const cameraArea =
    document.getElementById(
        "cameraAcessibilidade"
    );


const videoCamera =
    document.getElementById(
        "videoCamera"
    );


const cameraStatus =
    document.getElementById(
        "cameraStatus"
    );


const desligarCamera =
    document.getElementById(
        "desligarCamera"
    );


const ponteiroCamera =
    document.getElementById(
        "ponteiroCamera"
    );


const progressoClique =
    document.getElementById(
        "progressoClique"
    );


const tecladoVirtual =
    document.getElementById(
        "tecladoVirtual"
    );


const tituloTeclado =
    document.getElementById(
        "tituloTeclado"
    );


const teclas =
    document.getElementById(
        "teclas"
    );


/* ============================================================
   VARIÁVEIS
============================================================ */

let cameraLigada = false;

let cameraStream = null;

let ultimaPosicaoX = 0;

let ultimaPosicaoY = 0;

let tempoInicioParado = null;

let ultimoClique = 0;

let campoAtual = null;


/* TEMPO PARA CLICAR */

const TEMPO_CLIQUE = 1200;


/* DISTÂNCIA PARA CONSIDERAR PARADO */

const DISTANCIA_PARADO = 18;


/* ============================================================
   ATIVAR CÂMERA
============================================================ */

ativarCamera.addEventListener(
    "click",
    iniciarCamera
);


async function iniciarCamera() {

    try {

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    width: 640,

                    height: 480,

                    facingMode: "user"

                },

                audio: false

            });


        videoCamera.srcObject =
            cameraStream;


        cameraLigada = true;


        cameraArea.style.display =
            "block";


        ativarCamera.style.display =
            "none";


        ponteiroCamera.style.display =
            "block";


        cameraStatus.textContent =
            "Aponte o dedo indicador para a tela";


        iniciarReconhecimentoMao();


    } catch (erro) {

        console.error(erro);


        alert(
            "Não foi possível acessar a câmera. Permita o uso da câmera no navegador e tente novamente."
        );

    }

}


/* ============================================================
   DESLIGAR CÂMERA
============================================================ */

desligarCamera.addEventListener(
    "click",
    desligarCameraSistema
);


function desligarCameraSistema() {

    cameraLigada = false;


    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                function (track) {

                    track.stop();

                }
            );

    }


    videoCamera.srcObject =
        null;


    cameraArea.style.display =
        "none";


    ativarCamera.style.display =
        "block";


    ponteiroCamera.style.display =
        "none";


    progressoClique.style.display =
        "none";


    fecharTeclado();

}


/* ============================================================
   MEDIAPIPE HANDS
============================================================ */

function iniciarReconhecimentoMao() {

    const hands =
        new Hands({

            locateFile:
                function (arquivo) {

                    return (
                        "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
                        arquivo
                    );

                }

        });


    hands.setOptions({

        maxNumHands: 1,

        modelComplexity: 1,

        minDetectionConfidence: 0.6,

        minTrackingConfidence: 0.6

    });


    hands.onResults(
        processarMao
    );


    const camera =
        new Camera(

            videoCamera,

            {

                onFrame:
                    async function () {

                        if (
                            !cameraLigada
                        ) {

                            return;

                        }


                        await hands.send({

                            image:
                                videoCamera

                        });

                    },

                width: 640,

                height: 480

            }

        );


    camera.start();

}


/* ============================================================
   PROCESSA A MÃO
============================================================ */

function processarMao(resultados) {

    if (!cameraLigada) {

        return;

    }


    if (
        !resultados.multiHandLandmarks ||
        resultados.multiHandLandmarks.length === 0
    ) {

        cameraStatus.textContent =
            "Mão não encontrada";


        progressoClique.style.display =
            "none";


        return;

    }


    cameraStatus.textContent =
        "Mova o dedo indicador pela tela";


    const pontos =
        resultados.multiHandLandmarks[0];


    /*
     * Ponto 8 = ponta do dedo indicador
     */

    const dedo =
        pontos[8];


    /*
     * Como a câmera é espelhada,
     * invertimos o X.
     */

    let x =
        (1 - dedo.x) *
        window.innerWidth;


    let y =
        dedo.y *
        window.innerHeight;


    /*
     * Mantém o ponteiro dentro da tela.
     */

    x =
        Math.max(
            10,
            Math.min(
                window.innerWidth - 10,
                x
            )
        );


    y =
        Math.max(
            10,
            Math.min(
                window.innerHeight - 10,
                y
            )
        );


    ponteiroCamera.style.left =
        x + "px";


    ponteiroCamera.style.top =
        y + "px";


    verificarCliquePorPermanencia(
        x,
        y
    );

}


/* ============================================================
   CLIQUE POR PERMANÊNCIA
============================================================ */

function verificarCliquePorPermanencia(
    x,
    y
) {

    const agora =
        Date.now();


    const distancia =
        Math.sqrt(

            Math.pow(
                x - ultimaPosicaoX,
                2
            )

            +

            Math.pow(
                y - ultimaPosicaoY,
                2
            )

        );


    /*
     * Se o dedo se mexeu muito,
     * reinicia o contador.
     */

    if (
        distancia >
        DISTANCIA_PARADO
    ) {

        tempoInicioParado =
            agora;


        progressoClique.style.display =
            "none";

    }


    ultimaPosicaoX =
        x;


    ultimaPosicaoY =
        y;


    if (
        !tempoInicioParado
    ) {

        tempoInicioParado =
            agora;

    }


    const tempoParado =
        agora -
        tempoInicioParado;


    if (
        tempoParado >
        100 &&
        tempoParado <
        TEMPO_CLIQUE
    ) {

        progressoClique.style.display =
            "block";


        progressoClique.style.left =
            x + "px";


        progressoClique.style.top =
            y + "px";


        const progresso =
            tempoParado /
            TEMPO_CLIQUE;


        progressoClique.style.transform =
            "translate(-50%, -50%) scale(" +
            Math.max(
                0.2,
                progresso
            ) +
            ")";

    }


    /*
     * Tempo atingido = clique
     */

    if (
        tempoParado >=
        TEMPO_CLIQUE
    ) {

        if (
            agora -
            ultimoClique >
            1600
        ) {

            executarCliqueCamera(
                x,
                y
            );

            ultimoClique =
                agora;

        }


        tempoInicioParado =
            agora;


        progressoClique.style.display =
            "none";

    }

}


/* ============================================================
   EXECUTAR CLIQUE
============================================================ */

function executarCliqueCamera(
    x,
    y
) {

    const elemento =
        document.elementFromPoint(
            x,
            y
        );


    if (!elemento) {

        return;

    }


    /*
     * TECLADO VIRTUAL
     */

    if (
        elemento.classList.contains(
            "tecla"
        )
    ) {

        elemento.click();

        return;

    }


    /*
     * CAMPO DO FORMULÁRIO
     */

    if (
        elemento.tagName ===
        "INPUT"
    ) {

        abrirTeclado(
            elemento
        );

        return;

    }


    /*
     * BOTÕES
     */

    if (
        elemento.tagName ===
        "BUTTON"
    ) {

        elemento.click();

        return;

    }


    /*
     * Caso esteja sobre algum
     * elemento filho de botão.
     */

    const botaoPai =
        elemento.closest(
            "button"
        );


    if (botaoPai) {

        botaoPai.click();

        return;

    }


    /*
     * VLibras
     */

    const elementoVLibras =
        elemento.closest(
            "[vw-access-button]"
        );


    if (elementoVLibras) {

        elementoVLibras.click();

    }

}


/* ============================================================
   ABRIR TECLADO
============================================================ */

function abrirTeclado(
    campo
) {

    campoAtual =
        campo;


    tecladoVirtual.style.display =
        "block";


    if (
        campo.id ===
        "nome"
    ) {

        tituloTeclado.textContent =
            "Digite seu nome";


        criarTecladoLetras();

    }


    else if (
        campo.id ===
        "cpf"
    ) {

        tituloTeclado.textContent =
            "Digite seu CPF";


        criarTecladoNumerico(
            11
        );

    }


    else if (
        campo.id ===
        "titulo"
    ) {

        tituloTeclado.textContent =
            "Digite seu título de eleitor";


        criarTecladoNumerico(
            12
        );

    }

}


/* ============================================================
   FECHAR TECLADO
============================================================ */

function fecharTeclado() {

    tecladoVirtual.style.display =
        "none";


    campoAtual =
        null;

}


/* ============================================================
   TECLADO DE LETRAS
============================================================ */

function criarTecladoLetras() {

    teclas.innerHTML =
        "";


    const letras =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


    for (
        let i = 0;
        i < letras.length;
        i++
    ) {

        criarTecla(
            letras[i],
            "letra"
        );

    }


    criarTecla(
        "ESPAÇO",
        "especial",
        function () {

            inserirTexto(
                " "
            );

        }
    );


    criarTecla(
        "⌫",
        "apagar",
        apagarCaractere
    );


    criarTecla(
        "OK",
        "ok",
        fecharTeclado
    );

}


/* ============================================================
   TECLADO NUMÉRICO
============================================================ */

function criarTecladoNumerico(
    limite
) {

    teclas.innerHTML =
        "";


    for (
        let numero = 1;
        numero <= 9;
        numero++
    ) {

        criarTecla(
            String(numero),
            "numero",
            function () {

                inserirNumero(
                    String(numero),
                    limite
                );

            }
        );

    }


    criarTecla(
        "0",
        "numero",
        function () {

            inserirNumero(
                "0",
                limite
            );

        }
    );


    criarTecla(
        "⌫",
        "apagar",
        apagarCaractere
    );


    criarTecla(
        "OK",
        "ok",
        fecharTeclado
    );

}


/* ============================================================
   CRIAR TECLA
============================================================ */

function criarTecla(
    texto,
    tipo,
    funcao
) {

    const tecla =
        document.createElement(
            "button"
        );


    tecla.type =
        "button";


    tecla.textContent =
        texto;


    tecla.className =
        "tecla";


    if (
        tipo ===
        "especial"
    ) {

        tecla.classList.add(
            "tecla-especial"
        );

    }


    if (
        tipo ===
        "apagar"
    ) {

        tecla.classList.add(
            "tecla-apagar"
        );

    }


    if (
        tipo ===
        "ok"
    ) {

        tecla.classList.add(
            "tecla-ok"
        );

    }


    if (funcao) {

        tecla.addEventListener(
            "click",
            funcao
        );

    }


    else {

        tecla.addEventListener(
            "click",
            function () {

                inserirTexto(
                    texto
                );

            }
        );

    }


    teclas.appendChild(
        tecla
    );

}


/* ============================================================
   INSERIR TEXTO
============================================================ */

function inserirTexto(
    texto
) {

    if (!campoAtual) {

        return;

    }


    if (
        campoAtual.id ===
        "nome"
    ) {

        const permitido =
            /^[A-Za-zÀ-ÿ\s]+$/;


        /*
         * Só permite letras e espaço.
         */

        if (
            texto === " " ||
            permitido.test(
                texto
            )
        ) {

            campoAtual.value +=
                texto;

        }

    }

}


/* ============================================================
   INSERIR NÚMERO
============================================================ */

function inserirNumero(
    numero,
    limite
) {

    if (!campoAtual) {

        return;

    }


    if (
        campoAtual.value.length >=
        limite
    ) {

        return;

    }


    campoAtual.value +=
        numero;

}


/* ============================================================
   APAGAR
============================================================ */

function apagarCaractere() {

    if (!campoAtual) {

        return;

    }


    campoAtual.value =
        campoAtual.value.slice(
            0,
            -1
        );

}


/* ============================================================
   TECLADO FÍSICO TAMBÉM CONTINUA FUNCIONANDO
============================================================ */

document.addEventListener(
    "keydown",
    function (evento) {

        if (!campoAtual) {

            return;

        }


        /*
         * ESC fecha o teclado.
         */

        if (
            evento.key ===
            "Escape"
        ) {

            fecharTeclado();

        }

    }
);


/* ============================================================
   GARANTE REGRAS DOS CAMPOS
============================================================ */

if (nome) {

    nome.addEventListener(
        "input",
        function () {

            this.value =
                this.value.replace(
                    /[^A-Za-zÀ-ÿ\s]/g,
                    ""
                );

        }
    );

}


if (cpf) {

    cpf.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(
                        /\D/g,
                        ""
                    )
                    .slice(
                        0,
                        11
                    );

        }
    );

}


if (titulo) {

    titulo.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(
                        /\D/g,
                        ""
                    )
                    .slice(
                        0,
                        12
                    );

        }
    );

}

</script>
